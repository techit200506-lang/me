<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="nbr">0</p>
    <button id="incrementation">+</button>
    <button id="decromentation">-</button>
    <script>
        let inc = document.getElementById("incrementation");
        let dec = document.getElementById("decromentation");
        let nbr = document.getElementById("nbr")

        let count = 0 ;

        inc.addEventListener("click",function() {
            count +=1;
            nbr.textContent = count ;

        });
        dec.addEventListener("click",function() {
            count -=1;
            nbr.textContent = count ;
        });
    </script>
</body>
</html>
